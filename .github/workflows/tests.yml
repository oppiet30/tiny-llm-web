name: PHP tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './vendor' -prune -o -path './.git' -prune -o -name '*.php' -type f -print0)

      - name: Build isolated test image
        run: docker build --file Dockerfile.test --tag tiny-llm-web-tests .

      - name: Run PHPUnit in Docker
        run: docker run --rm tiny-llm-web-tests

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: tiny_llm_web_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TINY_LLM_TEST_DB_HOST: 127.0.0.1
      TINY_LLM_TEST_DB_PORT: 3306
      TINY_LLM_TEST_DB_USER: root
      TINY_LLM_TEST_DB_PASSWORD: ci-root-password
      TINY_LLM_TEST_DB_NAME: tiny_llm_web_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y mariadb-client

      - name: Install PHP dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Initialize disposable integration database
        run: mariadb -h 127.0.0.1 -uroot -pci-root-password tiny_llm_web_test < tests/fixtures/mariadb-integration.sql

      - name: Run MariaDB integration tests
        run: vendor/bin/phpunit --filter MariaDbIntegration
